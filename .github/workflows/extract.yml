name: extract

on:
  push:
    branches: [sn25-actuals]
    paths: ["sn25/**", "wallets.json", ".github/workflows/extract.yml", "run.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Prices
        continue-on-error: true
        run: python sn25/prices.py 2026-07-25
      - name: Extract
        continue-on-error: true
        run: |
          ARGS=$(python -c "import json;print(json.load(open('run.json')).get('args',''))" 2>/dev/null || true)
          echo "args: $ARGS"
          timeout 19800 python sn25/extract.py $ARGS || echo "extract exited $?" >> data/raw/extract_log.txt
      - name: Commit data
        if: always()
        run: |
          git config user.name "sn25-actuals bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "data: extract run ${{ github.run_id }}" || echo "nothing to commit"
          git pull --rebase -X ours origin sn25-actuals || true
          git push || true
